name = "onethought-love"
compatibility_date = "2025-09-01"
main = "worker/index.js"

# 部署时保留在 Cloudflare 仪表盘（Variables and Secrets）中设置的明文变量，
# 避免每次部署 B2_ENDPOINT、B2_BUCKET 等被覆盖删除。
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/download/*"]

# ===== 用户系统（KV，免费、无需绑卡）=====
# 1) Cloudflare 控制台 → Workers & Pages → KV → Create namespace（名字随意，如 onethought-users）
# 2) 复制命名空间 ID，取消下面注释并把 <KV_ID> 换成真实 ID
# 3) 重新部署即可启用；未配置时用户系统会提示“未配置”，其余功能不受影响
# [[kv_namespaces]]
# binding = "USER_KV"
# id = "<KV_ID>"

# 每小时后端自动更新每日密码并写入文件（B2 的 _config/df-secret.json）
[triggers]
crons = ["0 * * * *"]
