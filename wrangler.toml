name = "onethought-love"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "onethought-downloads"

# ADMIN_PASSWORD 与 SESSION_SECRET 属于敏感信息，请勿写入本文件。
