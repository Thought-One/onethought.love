name = "onethought-love"
compatibility_date = "2025-09-01"
main = "worker/index.js"

# 部署时保留在 Cloudflare 仪表盘（Variables and Secrets）中设置的明文变量，
# 避免每次部署 B2_ENDPOINT、B2_BUCKET 等被覆盖删除。
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/download/*"]

# ===== 用户系统：KV 存储（免费、无需绑卡）=====
# 用户/验证码/头像都存放在这个 KV 命名空间（SUBSCRIPTIONS_KV），不写入 B2。
[[kv_namespaces]]
binding = "USER_KV"
id = "a868d342f2ae4fe78f80858ca5067492"

# 每小时后端自动更新每日密码并写入文件（B2 的 _config/df-secret.json）
[triggers]
crons = ["0 * * * *"]
